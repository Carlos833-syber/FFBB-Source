name: Build FFBB Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Haxe 4.1.5
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.1.5

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-29"
          sdkmanager "build-tools;29.0.3"
          sdkmanager "ndk;21.4.7075529"

      - name: Configure Android variables
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Setup Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install Haxelib libraries
        run: |
          haxelib install lime 7.8.0
          haxelib install openfl
          haxelib install flixel 4.10.0
          haxelib install flixel-addons 2.11.0
          haxelib install flixel-ui 2.4.0
          haxelib install hscript
          haxelib install newgrounds
          haxelib install flixel-tools

      - name: Setup Lime
        run: |
          haxelib run lime setup

      - name: Configure Lime Android
        run: |
          mkdir -p "$HOME/.lime"
          printf '%s\n' \
            "$ANDROID_SDK_ROOT" \
            "$ANDROID_SDK_ROOT/ndk/21.4.7075529" \
            "$JAVA_HOME" \
            | haxelib run lime setup android

      - name: Create APIStuff
        run: |
          cat > source/APIStuff.hx <<'EOF'
          package;

          class APIStuff
          {
              public static var API:String = "";
              public static var EncKey:String = "";
          }
          EOF

      - name: Verify Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK=$ANDROID_SDK"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

          test -d "$ANDROID_SDK_ROOT/build-tools/29.0.3"
          test -d "$ANDROID_NDK_ROOT"
          test -d "$JAVA_HOME"

      - name: Build Android APK
        run: |
          haxelib run lime build android -release

      - name: Find APK
        run: |
          find export -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FFBB-Source-Android
          path: export/**/*.apk
          if-no-files-found: error
