name: Build FFBB Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Haxe 4.1.5
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.1.5

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-29"
          sdkmanager "build-tools;29.0.3"
          sdkmanager "ndk;21.4.7075529"

      - name: Configure Android variables
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Setup Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install libraries
        run: |
          haxelib install lime 7.8.0
          haxelib install openfl
          haxelib install flixel 4.8.1
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install hscript
          haxelib install newgrounds
          haxelib install flixel-tools

      - name: Install Polymod
        run: |
          haxelib git polymod https://github.com/larsiusprime/polymod.git

      - name: Setup Lime
        run: |
          haxelib run lime setup

      - name: Setup Lime Android
        run: |
          printf "y\n$ANDROID_SDK_ROOT\n$ANDROID_SDK_ROOT/ndk/21.4.7075529\n" | haxelib run lime setup android

      - name: Create APIStuff
        run: |
          cat > source/APIStuff.hx <<'EOF'
          package;

          class APIStuff
          {
              public static var API:String = "";
              public static var EncKey:String = "";
          }
          EOF

      - name: Build Android APK
        run: |
          haxelib run lime build android -release

      - name: Find APK
        run: |
          find export -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FFBB-Source-Android
          path: export/**/*.apk
          if-no-files-found: error
