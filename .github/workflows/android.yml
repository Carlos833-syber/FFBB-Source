name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.1.5

      - name: Check Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-29"
          sdkmanager "build-tools;29.0.3"
          sdkmanager "ndk;21.4.7075529"

      - name: Setup Haxelib
        run: |
          mkdir -p "$HOME/haxelib"
          haxelib setup "$HOME/haxelib"

      - name: Install dependencies
        run: |
          haxelib install hxcpp
          haxelib install lime 7.8.0
          haxelib install openfl 8.9.7
          haxelib install flixel 4.8.1
          haxelib install flixel-addons 2.8.0
          haxelib install flixel-ui 2.4.0
          haxelib install hscript
          haxelib install newgrounds
          haxelib install flixel-tools

      - name: Setup Lime Android
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_SDK=$ANDROID_SDK_ROOT
          export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529
          export JAVA_HOME=$JAVA_HOME_17_X64
          haxelib run lime setup android

      - name: Build APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_SDK=$ANDROID_SDK_ROOT
          export ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529
          export JAVA_HOME=$JAVA_HOME_17_X64
          haxelib run lime build android -release

      - name: Find APK
        run: |
          find export -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forever-Engine-Android
          path: export/**/*.apk
